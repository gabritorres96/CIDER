name: ci

# NOTE: this workflow has NOT been executed on GitHub yet (see docs/PROGRESS.md). It mirrors the commands
# that were run locally on Windows 11 with MSVC 14.51 / CMake 4.2.

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        # 7-Zip is preinstalled on GitHub's Windows images; backend tests are reported as [SKIP] when
        # it is missing. The real LLVM-built fixtures and llvm-objdump goldens are committed
        # (tests/fixtures/real), so the real-Mach-O comparison needs no LLVM on the runner; the *live*
        # llvm-objdump test is skipped unless ORVYN_LLVM_BIN points at an LLVM install.
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # Experimental: AddressSanitizer with the runner's clang-cl. Not validated on GitHub yet, hence
  # continue-on-error. Locally the same flags pass with the portable LLVM 23.1.3 (docs/TESTING.md).
  asan:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          $env:PATH = "$llvm;$env:PATH"
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=LLD -DORVYN_SANITIZE=ON
      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          cmake --build build-asan
      - name: Test
        shell: pwsh
        run: |
          $rt = (& "C:\Program Files\LLVM\bin\clang-cl.exe" /clang:-print-resource-dir) + "\lib\windows"
          $env:PATH = "$rt;C:\Program Files\LLVM\bin;$env:PATH"
          ctest --test-dir build-asan --output-on-failure
